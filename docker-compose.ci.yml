version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.ci
    volumes:
      - .:/app
    environment:
      - SKIP_HEAVY_TESTS=1
    depends_on:
      - db
      - elasticsearch

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.3
    environment:
      - discovery.type=single-node