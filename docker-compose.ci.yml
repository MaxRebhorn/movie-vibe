version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      cache_to:
        - type=local,dest=/cache/docker
      cache_from:
        - type=local,src=/cache/docker
    environment:
      DEBUG: "0"
      TRANSFORMERS_CACHE: "/cache/transformers"
      SENTENCE_TRANSFORMERS_HOME: "/cache/transformers"
    volumes:
      - /cache:/cache

  db:
    profiles: ["ci"]

  elasticsearch:
    profiles: ["ci"]

  vektor:
    profiles: ["!ci"]

volumes:
  postgres_data:
  es_data:
  model_cache:
