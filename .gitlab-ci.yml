stages:
  - build
  - test
  - security
  - lint

default:
  image: python:3.10-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-test.txt
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - .cache/torch
      - .cache/huggingface
      - .cache/sentence_transformers
  variables:
    TRANSFORMERS_CACHE: ".cache/transformers"
    TORCH_HOME: ".cache/torch"
    SENTENCE_TRANSFORMERS_HOME: ".cache/sentence_transformers"
    PYTHONPATH: "$CI_PROJECT_DIR"
    DJANGO_SETTINGS_MODULE: django_backend.settings

# BUILD (docker image for local use, optional)
build:
  stage: build
  image: docker:20.10.24
  services:
    - docker:20.10.24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: 1
  script:
    - docker compose -f docker-compose.ci.yml build
  only:
    - merge_requests
    - main
    - dev

# TEST
test:
  stage: test
  services:
    - postgres:14
    - docker.elastic.co/elasticsearch/elasticsearch:8.10.2
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    ELASTICSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
  script:
    - coverage run manage.py test
    - coverage report --fail-under=80
    - coverage xml
    - coverage html
  artifacts:
    when: on_failure
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 1 week

# SECURITY (Bandit)
security:
  stage: security
  script:
    - bandit -r movies review tags tmdb user django_backend -f html -o bandit-report.html
  allow_failure: true
  artifacts:
    paths:
      - bandit-report.html
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# LINT (flake8 + mypy)
lint:
  stage: lint
  script:
    - flake8 movies review tags tmdb user django_backend > flake8.txt || true
    - mypy movies review tags tmdb user django_backend --config-file mypy.ini || true
  allow_failure: true
  artifacts:
    paths:
      - flake8.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
