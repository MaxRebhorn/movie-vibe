image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version
  # Clean up any previous containers and volumes
  - docker compose down -v --remove-orphans

build:
  stage: build
  script:
    - docker compose build

test:
  stage: test
  script:
    # Start services and wait for them to be healthy
    - docker compose up -d --wait

    # Database setup - simplified migration process
    - docker compose exec web python manage.py check
    - docker compose exec web python manage.py migrate --no-input

    # Install test requirements
    - docker compose exec web pip install coverage --root-user-action=ignore

    # Run tests with coverage
    - docker compose exec web coverage run manage.py test --noinput
    - docker compose exec web coverage report --fail-under=80
    - docker compose exec web coverage xml

    # Copy coverage file
    - docker cp $(docker compose ps -q web):/app/coverage.xml ./coverage.xml
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 week

after_script:
  - docker compose down -v