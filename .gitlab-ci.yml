image: docker:20.10.24  # Use a newer Docker version that includes 'docker compose'

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: "db"
  PYTHON_VERSION: "3.9"

services:
  - docker:20.10.24-dind  # Match client version

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version  # Verify new command format

build:
  stage: build
  script:
    - docker compose build  # Use 'docker compose' without hyphen

test:
  stage: test
  script:
    - docker compose up -d
    - timeout 60s bash -c 'until docker compose exec db pg_isready -h db -p 5432; do sleep 2 ; done'
    - docker compose exec web pip install -U pip
    - docker compose exec web pip install -r requirements.txt
    - docker compose exec web python manage.py test --noinput
  after_script:
    - docker compose down