image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: "db"
  PYTHON_VERSION: "3.9"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version

build:
  stage: build
  script:
    - docker compose build  # Korrigiert

test:
  stage: test
  script:
    - apk add --no-cache curl  # Install curl
    - docker compose up -d
    # Wait for PostgreSQL
    - timeout 60s sh -c 'until docker compose exec db pg_isready -h db -p 5432; do sleep 2; done'
    # Wait for Elasticsearch
    - timeout 60s sh -c 'until curl -f -s http://elasticsearch:9200; do sleep 2; done'
    # Wait for Django
    - timeout 30s sh -c 'until nc -z web 8000; do sleep 1; done'

    # Install dependencies
    - docker compose exec web pip install -U pip
    - docker compose exec web pip install -r requirements.txt
    - docker compose exec web pip install coverage

    # Run tests
    - docker compose exec web coverage run manage.py test --noinput
    - docker compose exec web coverage report --fail-under=80
    - docker compose exec web coverage html
    - docker compose exec web coverage xml

    # Copy reports
    - docker cp $(docker compose ps -q web):/app/htmlcov ./htmlcov
    - docker cp $(docker compose ps -q web):/app/coverage.xml ./coverage.xml

  artifacts:
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 1 week

after_script:
  - docker compose down