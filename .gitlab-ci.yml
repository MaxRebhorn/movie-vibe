image: docker:20.10.24

services:
  - docker:20.10.24-dind

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"
  SKIP_HEAVY_TESTS: "1"
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

stages:
  - build
  - test

before_script:
  - apk add --no-cache curl py3-pip docker-compose
  - docker info
  - docker compose version || docker-compose version

build:
  stage: build
  variables:
    SKIP_HEAVY_TESTS: "1"
  script:
    - docker build -f docker/Dockerfile --build-arg REQUIREMENTS=requirements-test.txt -t movie-vibe-test:latest .

test:
  stage: test
  services:
    - name: postgres:14
      alias: db
    - name: elasticsearch:7.17.6
      alias: elasticsearch
  variables:
    POSTGRES_HOST: db
  script:
    - docker compose -f docker-compose.yml build --build-arg REQUIREMENTS=requirements-test.txt
    - docker compose -f docker-compose.yml up -d --wait
    - docker compose exec -T web python manage.py migrate
    - docker compose exec -T web python manage.py createcachetable
    - docker compose exec -T web coverage run manage.py test --exclude=*embedding* --exclude=*vector* --noinput
    - docker compose exec -T web coverage report --fail-under=80
    - docker compose exec -T web coverage xml
    - docker cp $(docker compose ps -q web):/app/coverage.xml ./coverage.xml
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 week

after_script:
  - docker compose -f docker-compose.yml down --volumes --remove-orphans