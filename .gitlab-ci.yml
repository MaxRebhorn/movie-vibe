variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: "db"
  PYTHON_VERSION: "3.9"

services:
  - docker:19.03.12-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker-compose --version  # Check hyphenated version
  - apk add --no-cache py3-pip  # Install dependencies for docker-compose
  - pip3 install docker-compose  # Install docker-compose

build:
  stage: build
  script:
    - docker-compose --file docker-compose.yml build  # Use hyphenated command

test:
  stage: test
  script:
    - docker-compose --file docker-compose.yml up -d  # Use hyphenated
    - timeout 60s bash -c 'until docker-compose exec db pg_isready -h db -p 5432; do sleep 2 ; done'
    - docker-compose exec web pip install -U pip
    - docker-compose exec web pip install -r requirements.txt
    - docker-compose exec web python manage.py test --noinput
  after_script:
    - docker-compose down  # Use hyphenated