image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"
  SKIP_HEAVY_TESTS: "1"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version

build:
  stage: build
  script:
    # Build image using the test requirements
    - docker build --build-arg REQUIREMENTS=requirements-test.txt -t movie-vibe-test:latest .
  artifacts:
    expire_in: 1 hour
    paths:
      - .docker

test:
  stage: test
  script:
    - docker compose up -d --wait
    - docker compose exec web python manage.py migrate
    - docker compose exec web python manage.py createcachetable
    - docker compose exec web coverage run manage.py test --noinput
    - docker compose exec web coverage report --fail-under=80
    - docker compose exec web coverage xml
    - docker cp $(docker compose ps -q web):/app/coverage.xml ./coverage.xml
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 week

after_script:
  - docker compose down
