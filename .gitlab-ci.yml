stages:
  - test
  - deploy  # optional

variables:
  # Use 'postgres' as hostname to match GitLab CI service name
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/test_db"
  PYTHON_VERSION: "3.9"

services:
  - name: postgres:latest
    alias: postgres  # Explicitly set the alias

test:
  stage: test
  image: python:$PYTHON_VERSION
  before_script:
    - apt-get update -qy
    - apt-get install -y python3-dev libpq-dev postgresql-client
    # Wait for PostgreSQL to be ready
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - pip install -U pip
    - pip install -r requirements.txt
  script:
    - python manage.py test --noinput
  only:
    - merge_requests
    - master
    - main