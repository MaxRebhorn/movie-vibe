image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version

build:
  stage: build
  script:
    - docker compose build

test:
  stage: test
  script:
    - docker compose up -d --wait

    # Datenbank bereit?
    - docker compose exec web python manage.py migrate
    - docker compose exec web python manage.py createcachetable


    # Tests
    - docker compose exec web pip install coverage --root-user-action=ignore
    - docker compose exec web coverage run manage.py test --noinput
    - docker compose exec web coverage report --fail-under=80
    - docker compose exec web coverage xml


after_script:
  - docker compose down
