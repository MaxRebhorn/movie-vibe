image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"
  DOCKER_TLS_CERTDIR: ""  # Disable TLS for Docker-in-Docker for faster performance
  DOCKER_BUILDKIT: 1      # Enable BuildKit for faster builds
  COMPOSE_DOCKER_CLI_BUILD: 1  # Use Docker CLI for builds in compose
  PIP_CACHE_DIR: ".cache/pip"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test
  - security

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - venv/
  policy: pull-push  # Optimize cache behavior

before_script:
  - docker info
  - docker compose version

build:
  stage: build
  script:
    - docker compose build --parallel  # Build containers in parallel
  cache:
    policy: pull  # Only pull cache for build stage

test:
  stage: test
  script:
    - docker compose up -d --wait
    - >
      docker compose run --rm web bash -c "
      set -euxo pipefail
      pip install -r requirements.txt --cache-dir=$PIP_CACHE_DIR --root-user-action=ignore
      coverage run manage.py test --noinput --parallel=4  # Run tests in parallel
      coverage combine
      coverage report --fail-under=80 > coverage.txt || true
      cat coverage.txt
      coverage xml
      coverage html -d coverage_html
      "
    - docker compose down
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    paths:
      - coverage_html/
      - coverage.txt
      - coverage.xml
    expire_in: 1 week
  cache:
    policy: push  # Only push cache for test stage

bandit:
  stage: security
  image: python:3.11
  script:
    - pip install bandit
    - bandit -r . -f html -o bandit.html || true  # Continue even if issues found
  artifacts:
    paths:
      - bandit.html
    expire_in: 1 week
  allow_failure: true  # Don't fail pipeline for security findings