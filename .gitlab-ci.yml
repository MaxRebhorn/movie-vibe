image: docker:20.10.24

services:
  - docker:20.10.24-dind
  - name: postgres:14
    alias: db

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: db
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"
  SKIP_HEAVY_TESTS: "1"
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  API_KEY: "dummy-key"
  REQUIREMENTS: requirements-test.txt

stages:
  - build
  - test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - venv/

before_script:
  - apk add --no-cache docker-compose curl py3-pip
  - docker info
  - docker compose version || docker-compose version

build:
  stage: build
  script:
    - docker compose build --build-arg REQUIREMENTS=${REQUIREMENTS}

test:
  stage: test
  script:
    - docker system prune -af --volumes || true
    - docker compose up -d --wait

    # Wait for Elasticsearch to become healthy
    - |
      echo "Waiting for Elasticsearch..."
      for i in {1..30}; do
        STATUS=$(curl -s http://localhost:9200/_cluster/health | grep -Eo '"status":"[^"]+"' | cut -d':' -f2 | tr -d '"')
        if [ "$STATUS" = "green" ] || [ "$STATUS" = "yellow" ]; then
          echo "Elasticsearch is $STATUS"
          break
        fi
        echo "Still waiting for Elasticsearch... ($i)"
        sleep 2
      done

    # Migrate DB and create cache table
    - docker compose exec -T web python manage.py migrate
    - docker compose exec -T web python manage.py createcachetable

    # Run linters, security tools, and tests
    - |
      docker compose exec -T web bash -c "
        set -euxo pipefail

        echo 'Running ruff...'
        ruff check . || true

        echo 'Running bandit...'
        bandit -r . -x venv -ll -iii -o bandit_report.txt || true

        echo 'Running Django tests with coverage...'
        coverage run manage.py test \
          --exclude='*embedding*' \
          --exclude='*vector*' \
          --noinput
        coverage report --fail-under=80 > coverage.txt || true
        cat coverage.txt
        coverage xml
        coverage html -d coverage_html
      "

    - docker compose down --volumes --remove-orphans

  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    paths:
      - coverage_html/
      - coverage.txt
      - coverage.xml
      - bandit_report.txt
    expire_in: 1 week
