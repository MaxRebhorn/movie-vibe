image: docker:20.10.24

services:
  - docker:20.10.24-dind
  - name: postgres:14
    alias: db

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: db
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"
  SKIP_HEAVY_TESTS: "1"
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  API_KEY: "dummy-key"
  REQUIREMENTS: requirements-test.txt

stages:
  - build
  - test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - venv/

before_script:
  - apk add --no-cache docker-compose curl py3-pip
  - docker info
  - docker compose version || docker-compose version

build:
  stage: build
  script:
    - docker compose build --build-arg REQUIREMENTS=${REQUIREMENTS}
    - docker tag ${CI_PROJECT_NAME}_web:latest movie-vibe-test:latest

test:
  stage: test
  script:
    - docker system prune -af --volumes || true
    - docker compose up -d --wait
    - |
      echo "Waiting for Elasticsearch..."
      for i in $(seq 1 30); do
        if curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'; then
          echo "Elasticsearch ready!"
          break
        fi
        sleep 2
      done
    - docker compose exec -T web python manage.py migrate
    - docker compose exec -T web python manage.py createcachetable

    # Run static analysis here inside the same container
    - docker compose exec -T web /bin/sh -c "
        pip install --quiet bandit flake8 flake8-django coverage --cache-dir=.cache/pip --root-user-action=ignore && \
        bandit -r . -x venv,tests,migrations -o bandit_report.txt -f txt || true && \
        flake8 . --exclude=venv,migrations --format=html --htmldir=flake8_report || true
      "

    # Run tests with coverage
    - docker compose exec -T web bash -c "
        set -euxo pipefail
        coverage run manage.py test \
          --exclude='*embedding*' \
          --exclude='*vector*' \
          --noinput
        coverage report --fail-under=80 > coverage.txt || true
        cat coverage.txt
        coverage xml
        coverage html -d coverage_html
      "
    - docker compose down --volumes --remove-orphans

  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    paths:
      - bandit_report.txt
      - flake8_report/
      - coverage_html/
      - coverage.txt
      - coverage.xml
    expire_in: 1 week
