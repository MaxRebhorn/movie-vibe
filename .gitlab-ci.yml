image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: "db"
  PYTHON_VERSION: "3.9"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version

build:
  stage: build
  script:
    - docker compose build

test:
  stage: test
  script:
    - apk add --no-cache curl jq  # Install required tools
    - docker compose up -d --wait

    # Wait for PostgreSQL
    - timeout 60s sh -c 'until docker compose exec db pg_isready -h db -p 5432; do sleep 2; done'

    # Wait for Elasticsearch with detailed checks
    - |
      echo "Waiting for Elasticsearch to be ready..."
      end_time=$((SECONDS+120))
      while [ $SECONDS -lt $end_time ]; do
        if docker compose exec web curl -fs "http://elasticsearch:9200/_cluster/health?pretty" | \
           jq -e '.status == "green" or .status == "yellow"' >/dev/null; then
          echo "Elasticsearch is ready"
          break
        fi
        sleep 5
        echo "Elasticsearch not ready yet, checking logs..."
        docker compose logs --tail=5 elasticsearch
      done
      if [ $SECONDS -ge $end_time ]; then
        echo "Elasticsearch health check timed out!"
        exit 1
      fi

    # Install dependencies
    - docker compose exec web pip install -U pip
    - docker compose exec web pip install -r requirements.txt
    - docker compose exec web pip install coverage

    # Run tests
    - docker compose exec web coverage run manage.py test --noinput
    - docker compose exec web coverage report --fail-under=80
    - docker compose exec web coverage html
    - docker compose exec web coverage xml

    # Copy reports
    - docker cp $(docker compose ps -q web):/app/htmlcov ./htmlcov
    - docker cp $(docker compose ps -q web):/app/coverage.xml ./coverage.xml

  artifacts:
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 1 week

after_script:
  - docker compose down