image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  PYTHON_VERSION: "3.11"
  ELASTICSEARCH_DSL_HOSTS: "http://elasticsearch:9200"
  SKIP_HEAVY_TESTS: "1"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version

build:
  stage: build
  script:
    # Build the test image using Dockerfile.ci (with heavy test deps)
   - docker build -f docker/Dockerfile.ci -t movie-vibe-test:latest .
  artifacts:
    expire_in: 1 hour
    paths:
      # Cache the image layers (optional)
      - .docker

test:
  stage: test
  script:
    # Start services using docker-compose (make sure it uses the test image)
    - docker compose up -d --wait

    # Run migrations and cache setup
    - docker compose exec web python manage.py migrate
    - docker compose exec web python manage.py createcachetable

    # Run tests with coverage inside the container with test deps pre-installed
    - docker compose exec web coverage run manage.py test --noinput
    - docker compose exec web coverage report --fail-under=80
    - docker compose exec web coverage xml

    # Copy coverage report out of the container
    - docker cp $(docker compose ps -q web):/app/coverage.xml ./coverage.xml

  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 week

after_script:
  - docker compose down
