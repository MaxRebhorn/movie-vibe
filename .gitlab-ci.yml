image: docker:20.10.24

variables:
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  PYTHON_VERSION: "3.11"

services:
  - docker:20.10.24-dind

stages:
  - build
  - test

before_script:
  - docker info
  - docker compose version

build:
  stage: build
  script:
    - docker compose build

test:
  stage: test
  script:
    - docker compose up -d --wait

    # Wait for PostgreSQL to be ready
    - timeout 30s sh -c 'until docker compose exec db pg_isready; do sleep 2; done'

    # Apply migrations and create test database
    - docker compose exec web python manage.py migrate
    - docker compose exec web python manage.py createcachetable

    # Run tests with coverage
    - docker compose exec web pip install coverage
    - docker compose exec web coverage run manage.py test --noinput
    - docker compose exec web coverage report --fail-under=80
    - docker compose exec web coverage xml

    # Copy coverage report
    - docker cp $(docker compose ps -q web):/app/coverage.xml ./coverage.xml

  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 week

after_script:
  - docker compose down