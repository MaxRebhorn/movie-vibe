version: '3.8'

services:
  db:
    image: postgres:15
    container_name: django_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_db}
      POSTGRES_USER: ${POSTGRES_USER:-django_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - django_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django_user} -d ${POSTGRES_DB:-django_db}"]
      interval: 5s
      timeout: 2s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: django_web
    command: /app/docker/entrypoint.sh python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - model_cache:/app/.cache
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - django_network

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: django_test
    command: bash -c "python manage.py migrate && python manage.py test --keepdb"
    volumes:
      - .:/app
    environment:
      - DEBUG=0
      - POSTGRES_HOST=db
      - TEST_DATABASE_NAME=test_django_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - django_network

volumes:
  postgres_data:
  model_cache:

networks:
  django_network:
    driver: bridge