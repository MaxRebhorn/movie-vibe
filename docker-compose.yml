version: '3.8'

services:
  db:
    image: postgres:15
    container_name: django_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_db}
      POSTGRES_USER: ${POSTGRES_USER:-django_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - django_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django_user} -d ${POSTGRES_DB:-django_db}"]
      interval: 5s
      timeout: 2s
      retries: 10

  vektor:
    environment:
      - QDRANT_HOST=vektor
      - QDRANT_PORT=6333
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - django_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: django_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - http.host=0.0.0.0  # Explicitly bind to all interfaces
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - django_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s || exit 1"]
      interval: 10s
      timeout: 30s  # Increased from 15s
      retries: 20
      start_period: 30s  # Give ES time to start before health checks

  web:
    image: movie-vibe-test:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: ${REQUIREMENTS:-requirements.txt}
    container_name: django_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - model_cache:/app/.cache
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - POSTGRES_DB=${POSTGRES_DB:-django_db}
      - POSTGRES_USER=${POSTGRES_USER:-django_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-django_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_DSL_HOSTS=${ELASTICSEARCH_DSL_HOSTS:-http://elasticsearch:9200}
      - API_KEY=${API_KEY}
      - TRANSFORMERS_CACHE=/app/.cache
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - django_network
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
  qdrant_data:
  model_cache:

networks:
  django_network:
    driver: bridge
